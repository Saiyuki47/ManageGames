# Weekly update pull requests for the NuGet packages, the local .NET tools and the GitHub Actions.
# Bootstrap is managed by LibMan (ManageGames/libman.json), which Dependabot doesn't know; see the README.
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # EF Core, Identity, the PostgreSQL provider, the test host and the dotnet-ef tool share one
      # version line.
      aspnetcore-efcore:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.Extensions.*"
          - "Npgsql*"
          - "dotnet-ef"
      tests:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "Microsoft.Testing.*"
          - "Testcontainers*"
          - "dotnet-reportgenerator-globaltool"
      # New analyzer versions can bring new rules that fail the build; one PR to review together.
      analyzers:
        patterns:
          - "Meziantou.Analyzer"
          - "SonarAnalyzer.CSharp"

  # The PostgreSQL image of the local development database.
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly

  # Also updates the pinned commit SHAs and their version comments in the workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
