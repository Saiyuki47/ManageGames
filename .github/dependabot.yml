# Weekly update pull requests for the NuGet packages, the local .NET tools and the GitHub Actions.
# Bootstrap is managed by LibMan (ManageGames/libman.json), which Dependabot doesn't know; see the README.
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # EF Core, Identity, the PostgreSQL provider, the test host and the dotnet-ef tool share one
      # version line.
      aspnetcore-efcore:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.Extensions.*"
          - "Microsoft.Data.Sqlite"
          - "Npgsql*"
          - "dotnet-ef"
      tests:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "Testcontainers*"

  # The PostgreSQL image of the local development database.
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
